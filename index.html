<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 ShortLink - URL Shortener Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 0 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 16px;
        }

        /* Form */
        .form-card {
            background: rgba(30, 30, 50, 0.8);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #2d3748;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 16px 20px;
            background: #0f0f1a;
            border: 2px solid #2d3748;
            border-radius: 12px;
            color: #e0e0ff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .btn-shorten {
            padding: 16px 32px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-shorten:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }

        .btn-shorten:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Options */
        .form-options {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }

        .form-options input[type="checkbox"] {
            accent-color: #4f46e5;
            width: 16px;
            height: 16px;
        }

        .form-options input[type="text"] {
            padding: 6px 12px;
            background: #0f0f1a;
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #e0e0ff;
            font-size: 14px;
            width: 180px;
        }

        .form-options input[type="text"]:disabled {
            opacity: 0.4;
        }

        /* Result */
        .result-card {
            background: rgba(30, 30, 50, 0.8);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #2d3748;
            display: none;
            animation: slideUp 0.5s ease;
        }

        .result-card.show {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .result-url {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #0f0f1a;
            border-radius: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .short-url {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #a78bfa;
            word-break: break-all;
            min-width: 200px;
        }

        .url-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.05);
        }

        .btn-copy {
            background: #4f46e5;
            color: white;
        }

        .btn-visit {
            background: #10b981;
            color: white;
        }

        .btn-qr {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .stat-item {
            background: #0f0f1a;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-item .label {
            font-size: 12px;
            color: #6b7280;
            display: block;
        }

        .stat-item .value {
            font-size: 14px;
            color: #e0e0ff;
            display: block;
            margin-top: 4px;
            word-break: break-all;
        }

        /* QR Code */
        #qrContainer {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 16px;
            background: #0f0f1a;
            border-radius: 12px;
        }

        #qrContainer.show {
            display: block;
        }

        #qrContainer canvas {
            margin: 0 auto;
        }

        /* History */
        .history-section {
            margin-top: 30px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .history-header h2 {
            font-size: 20px;
        }

        .btn-clear {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(30, 30, 50, 0.5);
            border-radius: 10px;
            border: 1px solid #2d3748;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item .url-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 150px;
        }

        .history-item .short {
            color: #a78bfa;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .history-item .short:hover {
            text-decoration: underline;
        }

        .history-item .original {
            color: #6b7280;
            font-size: 12px;
            word-break: break-all;
        }

        .history-item .time {
            color: #6b7280;
            font-size: 11px;
        }

        .history-item .actions {
            display: flex;
            gap: 6px;
        }

        .history-item .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Error */
        .error-message {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            color: #6b7280;
            font-size: 14px;
            border-top: 1px solid #1e293b;
            margin-top: 30px;
            width: 100%;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .btn-shorten {
                width: 100%;
                justify-content: center;
            }
            .form-options {
                flex-direction: column;
            }
            .form-options input[type="text"] {
                width: 100%;
            }
            .result-url {
                flex-direction: column;
            }
            .url-actions {
                width: 100%;
                justify-content: center;
            }
            .header h1 {
                font-size: 24px;
            }
            .history-item {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🔗</div>
            <h1>ShortLink</h1>
            <p>Shorten your URLs instantly and track them</p>
        </div>

        <!-- Form -->
        <div class="form-card">
            <form id="urlForm">
                <div class="input-group">
                    <input 
                        type="url" 
                        id="longUrl" 
                        placeholder="Paste your long URL here..." 
                        required
                        autofocus
                    >
                    <button type="submit" class="btn-shorten" id="submitBtn">
                        <span>Shorten</span>
                        <span style="margin-left:8px;">→</span>
                    </button>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="customAlias">
                        Custom Alias
                        <input type="text" id="aliasInput" placeholder="my-custom-link" disabled style="width:150px;">
                    </label>
                </div>
            </form>
            <div id="errorContainer"></div>
        </div>

        <!-- Result -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <span>✅</span> URL Shortened Successfully!
            </div>
            <div class="result-url">
                <div class="short-url" id="shortUrl">https://short.link/abc123</div>
                <div class="url-actions">
                    <button class="btn-action btn-copy" onclick="copyUrl()">📋 Copy</button>
                    <button class="btn-action btn-visit" onclick="visitUrl()">🚀 Visit</button>
                    <button class="btn-action btn-qr" onclick="toggleQR()">📱 QR</button>
                    <button class="btn-action btn-delete" onclick="deleteUrl()">🗑️</button>
                </div>
            </div>
            <div id="qrContainer">
                <canvas id="qrCanvas"></canvas>
            </div>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="label">Original URL</span>
                    <span class="value" id="originalUrl">-</span>
                </div>
                <div class="stat-item">
                    <span class="label">Clicks</span>
                    <span class="value" id="clickCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Created</span>
                    <span class="value" id="createdAt">Just now</span>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="history-section" id="historySection">
            <div class="history-header">
                <h2>📜 History</h2>
                <button class="btn-clear" onclick="clearHistory()">Clear All</button>
            </div>
            <div class="history-list" id="historyList">
                <p style="color:#6b7280; text-align:center; padding:20px;">
                    No URLs shortened yet. Start now!
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Made with ❤️ | <a href="#" onclick="exportData()">📤 Export Data</a> | 
            <a href="#" onclick="importData()">📥 Import Data</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 FULLY FUNCTIONAL URL SHORTENER
        // ============================================================

        // Data storage
        let urlData = [];
        let currentCode = null;

        // Load saved data
        function loadData() {
            try {
                const saved = localStorage.getItem('shortlink_data');
                if (saved) {
                    urlData = JSON.parse(saved);
                    renderHistory();
                }
            } catch (e) {
                console.error('Error loading data:', e);
            }
        }

        // Save data
        function saveData() {
            try {
                localStorage.setItem('shortlink_data', JSON.stringify(urlData));
            } catch (e) {
                console.error('Error saving data:', e);
            }
        }

        // Generate short code
        function generateCode(length = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < length; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Check if code exists
        function codeExists(code) {
            return urlData.some(item => item.code === code);
        }

        // Generate unique code
        function generateUniqueCode() {
            let code;
            let attempts = 0;
            do {
                code = generateCode(6);
                attempts++;
            } while (codeExists(code) && attempts < 100);
            return code;
        }

        // Get base URL
        function getBaseUrl() {
            // Gunakan URL saat ini sebagai base
            const url = window.location.href;
            const baseUrl = url.split('?')[0].split('#')[0];
            return baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
        }

        // Shorten URL
        function shortenUrl(longUrl, customAlias = null) {
            // Validate URL
            try {
                new URL(longUrl);
            } catch {
                throw new Error('Invalid URL format');
            }

            // Check if URL already shortened
            const existing = urlData.find(item => item.originalUrl === longUrl);
            if (existing) {
                return existing;
            }

            // Generate code
            let code = customAlias ? customAlias.trim() : generateUniqueCode();
            
            // If custom alias provided, check if available
            if (customAlias) {
                if (codeExists(code)) {
                    throw new Error('Custom alias already taken. Please choose another.');
                }
                if (!/^[a-zA-Z0-9_-]+$/.test(code)) {
                    throw new Error('Alias can only contain letters, numbers, underscores, and hyphens.');
                }
            }

            // Create short URL
            const baseUrl = getBaseUrl();
            const shortUrl = baseUrl + code;

            const entry = {
                code: code,
                shortUrl: shortUrl,
                originalUrl: longUrl,
                clicks: 0,
                createdAt: new Date().toISOString(),
                lastAccessed: null
            };

            urlData.push(entry);
            saveData();
            renderHistory();

            return entry;
        }

        // Get URL by code
        function getUrlByCode(code) {
            const entry = urlData.find(item => item.code === code);
            if (entry) {
                entry.clicks = (entry.clicks || 0) + 1;
                entry.lastAccessed = new Date().toISOString();
                saveData();
                renderHistory();
                return entry;
            }
            return null;
        }

        // Delete URL
        function deleteUrlByCode(code) {
            urlData = urlData.filter(item => item.code !== code);
            saveData();
            renderHistory();
            if (currentCode === code) {
                document.getElementById('resultCard').classList.remove('show');
                currentCode = null;
            }
        }

        // ============================================================
        // UI FUNCTIONS
        // ============================================================

        // Show result
        function showResult(entry) {
            currentCode = entry.code;
            document.getElementById('shortUrl').textContent = entry.shortUrl;
            document.getElementById('originalUrl').textContent = entry.originalUrl;
            document.getElementById('clickCount').textContent = entry.clicks || 0;
            document.getElementById('createdAt').textContent = new Date(entry.createdAt).toLocaleString();
            
            const resultCard = document.getElementById('resultCard');
            resultCard.classList.add('show');
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Reset QR
            document.getElementById('qrContainer').classList.remove('show');
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Render history
        function renderHistory() {
            const list = document.getElementById('historyList');
            
            if (urlData.length === 0) {
                list.innerHTML = '<p style="color:#6b7280; text-align:center; padding:20px;">No URLs shortened yet. Start now!</p>';
                return;
            }

            // Sort by newest first
            const sorted = [...urlData].sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            list.innerHTML = sorted.map(item => `
                <div class="history-item">
                    <div class="url-info">
                        <span class="short" onclick="redirectTo('${item.code}')">${item.shortUrl}</span>
                        <span class="original">${item.originalUrl}</span>
                        <span class="time">${new Date(item.createdAt).toLocaleString()} • ${item.clicks || 0} clicks</span>
                    </div>
                    <div class="actions">
                        <button onclick="copyText('${item.shortUrl}')" style="background:#4f46e5;color:white;">Copy</button>
                        <button onclick="viewDetails('${item.code}')" style="background:#3b82f6;color:white;">View</button>
                        <button onclick="deleteUrlByCode('${item.code}')" style="background:#ef4444;color:white;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Redirect to original URL
        function redirectTo(code) {
            const entry = getUrlByCode(code);
            if (entry) {
                window.open(entry.originalUrl, '_blank');
            } else {
                showError('URL not found');
            }
        }

        // View details
        function viewDetails(code) {
            const entry = urlData.find(item => item.code === code);
            if (entry) {
                showResult(entry);
            } else {
                showError('URL not found');
            }
        }

        // Copy text
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = original;
                }, 2000);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Copied!');
            });
        }

        // ============================================================
        // EVENT HANDLERS
        // ============================================================

        // Form submit
        document.getElementById('urlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const longUrl = document.getElementById('longUrl').value.trim();
            const customAlias = document.getElementById('aliasInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!longUrl) {
                showError('Please enter a URL');
                return;
            }

            // Show loading
            submitBtn.innerHTML = '<span class="loading"></span> Processing...';
            submitBtn.disabled = true;

            try {
                // Simulate network delay for realism
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const result = shortenUrl(longUrl, customAlias || null);
                showResult(result);
                
                // Clear form
                document.getElementById('longUrl').value = '';
                document.getElementById('aliasInput').value = '';
                document.getElementById('customAlias').checked = false;
                document.getElementById('aliasInput').disabled = true;
                
            } catch (error) {
                showError(error.message);
            } finally {
                submitBtn.innerHTML = '<span>Shorten</span><span style="margin-left:8px;">→</span>';
                submitBtn.disabled = false;
            }
        });

        // Toggle custom alias
        document.getElementById('customAlias').addEventListener('change', function() {
            const input = document.getElementById('aliasInput');
            input.disabled = !this.checked;
            if (this.checked) {
                input.focus();
            }
        });

        // Copy URL
        function copyUrl() {
            const url = document.getElementById('shortUrl').textContent;
            copyText(url);
        }

        // Visit URL
        function visitUrl() {
            const url = document.getElementById('shortUrl').textContent;
            window.open(url, '_blank');
        }

        // Toggle QR
        function toggleQR() {
            const container = document.getElementById('qrContainer');
            const canvas = document.getElementById('qrCanvas');
            
            if (container.classList.contains('show')) {
                container.classList.remove('show');
                return;
            }
            
            const url = document.getElementById('shortUrl').textContent;
            generateQR(canvas, url);
            container.classList.add('show');
        }

        // Generate QR Code
        function generateQR(canvas, text) {
            // Simple QR code using canvas (without external lib)
            // For real QR, we use QRCode.js CDN
            if (typeof QRCode === 'undefined') {
                // Load QRCode.js
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
                script.onload = function() {
                    canvas.parentElement.innerHTML = '';
                    const newCanvas = document.createElement('canvas');
                    canvas.parentElement.appendChild(newCanvas);
                    new QRCode(newCanvas, {
                        text: text,
                        width: 200,
                        height: 200,
                        colorDark: '#ffffff',
                        colorLight: '#0a0a0f'
                    });
                };
                document.head.appendChild(script);
            } else {
                canvas.parentElement.innerHTML = '';
                const newCanvas = document.createElement('canvas');
                canvas.parentElement.appendChild(newCanvas);
                new QRCode(newCanvas, {
                    text: text,
                    width: 200,
                    height: 200,
                    colorDark: '#ffffff',
                    colorLight: '#0a0a0f'
                });
            }
        }

        // Delete current URL
        function deleteUrl() {
            if (currentCode) {
                deleteUrlByCode(currentCode);
                document.getElementById('resultCard').classList.remove('show');
                currentCode = null;
            }
        }

        // Clear history
        function clearHistory() {
            if (urlData.length === 0) return;
            if (confirm('Delete all shortened URLs?')) {
                urlData = [];
                saveData();
                renderHistory();
                document.getElementById('resultCard').classList.remove('show');
                currentCode = null;
            }
        }

        // Export data
        function exportData() {
            if (urlData.length === 0) {
                alert('No data to export');
                return;
            }
            const data = JSON.stringify(urlData, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shortlink_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Import data
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data)) {
                            urlData = data;
                            saveData();
                            renderHistory();
                            alert('Data imported successfully!');
                        } else {
                            alert('Invalid data format');
                        }
                    } catch (err) {
                        alert('Error importing data: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ============================================================
        // ROUTER: Redirect on load if code in URL
        // ============================================================

        function handleRedirect() {
            const path = window.location.pathname;
            const code = path.split('/').filter(Boolean).pop();
            
            if (code && code.length > 0) {
                // Check if it's our short code
                const entry = urlData.find(item => item.code === code);
                if (entry) {
                    entry.clicks = (entry.clicks || 0) + 1;
                    entry.lastAccessed = new Date().toISOString();
                    saveData();
                    renderHistory();
                    window.location.href = entry.originalUrl;
                    return true;
                }
            }
            return false;
        }

        // ============================================================
        // INIT
        // ============================================================

        loadData();

        // Handle redirect if needed
        if (!handleRedirect()) {
            // Show recent URL if exists
            if (urlData.length > 0) {
                const latest = urlData[urlData.length - 1];
                // Don't auto-show to keep clean
            }
        }

        // Log
        console.log('🔗 ShortLink loaded!');
        console.log(`📊 ${urlData.length} URLs in database`);

        // Keyboard shortcut
        document.addEventListener('keydown', function(e) {
            // Ctrl+Enter to submit
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('urlForm').dispatchEvent(new Event('submit'));
            }
        });

        // Auto focus
        document.getElementById('longUrl').focus();

        console.log('✅ Ready!');
    </script>
